name: Build caribou flavor assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-flavors.yml'
      - 'scripts/build_flavor_assets.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install Pillow
      - name: Make any missing flavor atlases (do not overwrite uploaded art)
        run: python scripts/build_flavor_assets.py
      - name: Commit atlases if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skins/*-atlas.webp
          if ! git diff --cached --quiet; then
            git commit -m "Create missing caribou flavor atlases"
            git pull --rebase origin main
            git push
          fi
