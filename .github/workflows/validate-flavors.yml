name: Validate Kombucha flavor build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-flavors.yml'
      - 'index.html'
      - 'skins/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate game script and store rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          script=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/kombucha-game.js').write_text(script)
          for string in ["id:'original'","id:'blackcurrant'","id:'tarragon'","id:'raspberry'","price:0","price:25","price:50","price:75","kombucha-run-wallet","kombucha-run-owned","kombucha-run-skin","getCaribouAtlas"]:
              assert string in script, string
          assert 'Ninja Shiba' not in s
          print('Gameplay and save compatibility checks passed')
          PY
          node --check /tmp/kombucha-game.js
      - name: Validate atlases
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for flavor in ['blackcurrant-juniper','tarragon-cedar','raspberry-mint']:
              p=Path('skins')/(flavor+'-atlas.webp')
              assert p.exists(), p
              with Image.open(p) as image:
                  assert image.size==(1280,960),(p,image.size)
                  assert image.mode in ['RGB','RGBA'],(p,image.mode)
              print('OK:',p)
          PY
